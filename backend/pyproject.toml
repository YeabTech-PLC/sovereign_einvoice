[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yeabtech-einvoice-backend"
version = "0.1.0"
description = "YeabTech Sovereign Electronic Invoicing Platform API"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "SQLAlchemy==2.0.57",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx==0.28.1",
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
